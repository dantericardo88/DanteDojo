[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dante-dojo"
version = "0.1.0"
description = "DanteDojo: Sovereign AI training, evaluation, specialization, and inference organ"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Real Empanada Corp", email = "hi@realempanada.com" }]
keywords = ["ai", "llm", "training", "evaluation", "fine-tuning", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "cryptography>=42.0",
    "pynvml>=11.5",
    "psutil>=5.9",
    "structlog>=24.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.4.0",
    "transformers>=4.46.0",
    "datasets>=3.0.0",
    "tokenizers>=0.20.0",
    "peft>=0.13.0",
    "accelerate>=1.0.0",
    "trl>=0.12.0",
    "bitsandbytes>=0.44.0",
    "unsloth>=2026.3.0",
    "axolotl>=0.16.0",
    "triton>=3.0.0",
]
quant = [
    "gptq-model>=6.0.0",
    "llm-compressor>=0.10.0",
    "safetensors>=0.4.0",
    "onnx>=1.17.0",
    "onnxruntime>=1.20.0",
]
serve = [
    "vllm>=0.13.0",
    "llama-cpp-python>=0.3.0",
]
route = [
    "litellm>=1.55.0,!=1.82.8",
]
eval = [
    "lm-eval>=0.4.5",
]
experiment = [
    "mlflow>=3.0.0",
]
apple = [
    "mlx>=0.20.0",
    "mlx-lm>=0.21.0",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://github.com/realempanada/dantedojo"
Repository = "https://github.com/realempanada/dantedojo"
Documentation = "https://github.com/realempanada/dantedojo#readme"

[project.scripts]
dojo = "dojo.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dojo*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
